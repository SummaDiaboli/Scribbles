name: release

# Cut a release by pushing a tag: git tag v0.6.0; git push origin v0.6.0
# The tag (minus the leading v) is the one source of truth for the version.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  VELOPACK_VERSION: 1.2.161
  PACK_ID: SummaDiaboli.Scribbles

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ($ver -notmatch "^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$") {
            Write-Error "Tag '${{ github.ref_name }}' is not SemVer (expected v1.2.3)"
            exit 1
          }
          "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Releasing $ver"

      - run: dotnet restore Scribbles.sln
      - run: dotnet build Scribbles.sln --no-restore
      - run: dotnet test tests/Scribbles.Unit.Tests/Scribbles.Unit.Tests.csproj --no-build
      - run: dotnet test tests/Scribbles.Integration.Tests/Scribbles.Integration.Tests.csproj --no-build

      - name: Publish self-contained
        run: dotnet publish Scribbles.App/Scribbles.App.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.APP_VERSION }}

      - name: Pack and upload with Velopack
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version ${{ env.VELOPACK_VERSION }}
          vpk download github --repoUrl https://github.com/${{ github.repository }}
          vpk pack -u ${{ env.PACK_ID }} -v ${{ env.APP_VERSION }} -p publish --mainExe Scribbles.App.exe
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "Scribbles ${{ env.APP_VERSION }}" --tag "v${{ env.APP_VERSION }}" --token ${{ secrets.GITHUB_TOKEN }}
